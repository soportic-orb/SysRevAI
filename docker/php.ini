; SysRevAI — PHP runtime settings tuned for the platform's requirements.
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 52M
max_execution_time = 120
max_input_time = 120

; Sensible defaults; HTTPS-related cookie flags are set by the app at runtime.
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1

expose_php = Off
date.timezone = Europe/Madrid
